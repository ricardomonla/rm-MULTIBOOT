# ── ChromeOS / ChromeOS Flex ──────────────────────────────────────────────────
# NOTA: ChromeOS Flex no es una ISO — es una imagen de disco (.bin.zip).
# No se puede bootear directo por GRUB loopback.
# Se descarga a la partición MULTIBOOT y desde ahí se flashea a un pendrive
# con: dd if=chromeos_reven_*.bin of=/dev/sdX bs=4M status=progress
ChromeOS Flex (stable)          | https://dl.google.com/dl/edgedl/chromeos/recovery/chromeos_16581.54.0_reven_recovery_stable-channel_RevenMPKeys-v10.bin.zip
